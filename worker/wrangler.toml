# The kcsc-data Worker: serves the private aimesy/kcsc-data repository to the
# viewer at kcsc.amyc.us (README "Data Worker"). Deployed by the data-worker
# job in .github/workflows/pages.yml; needs Wrangler 4.107.0 or later for the
# cache settings of each entrypoint below.

name = "kcsc-data"
main = "index.js"
account_id = "06e69f381ac9e7c54620cb6fa5dc34d6"
# ctx.exports is on by default from 2025-11-17.
compatibility_date = "2026-10-01"

workers_dev = false
preview_urls = false
routes = [{ pattern = "kcsc-data.amyc.us", custom_domain = true }]

[vars]
# Pages allowed to read the data, matched against Origin, or else the origin
# of Referer. Separate with spaces. https://aimesy.github.io/kcsc/ redirects
# to kcsc.amyc.us, so the viewer never runs on aimesy.github.io; add that
# origin only if the custom domain is removed.
ALLOWED_ORIGINS = "https://kcsc.amyc.us"

# Requests per IP address per period. period must be 10 or 60; if it changes,
# change RETRY_AFTER_SECONDS in release.js to match. namespace_id must be
# unique in the Cloudflare account (mfa-data uses 1001).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "5272"

  [ratelimits.simple]
  limit = 300
  period = 60

# Workers Caching sits in front of every entrypoint. The default entrypoint
# (origin check and rate limit) must stay uncached, or a cache hit would skip
# both; only Release, which fetches from GitHub, is cached.
[cache]
enabled = true

[exports.default]
type = "worker"

  [exports.default.cache]
  enabled = false

[exports.Release]
type = "worker"

  [exports.Release.cache]
  enabled = true

# The GitHub token is the secret KCSC_DATA_TOKEN, set by the workflow from the
# KCSC_DATA_ACCESS Actions secret. It is never written here.
