name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check viewer and shared theme static contracts
        run: node scripts/check_viewer_static.mjs
      - name: Test viewer data contracts and load progress
        run: |
          node assets/js/kcsc-data-client.test.mjs
          node assets/js/kcsc-directory.test.mjs
          node assets/js/kcsc-statistics.test.mjs
          node assets/js/load-progress.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
